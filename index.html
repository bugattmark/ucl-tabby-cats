<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thai Voice Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .output-box {
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 16px;
            line-height: 1.6;
        }

        .label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .record-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 48px;
            cursor: pointer;
            margin: 30px auto;
            display: block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .record-btn:active {
            transform: scale(0.95);
        }

        .record-btn.recording {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status {
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }

        .status.active {
            opacity: 1;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:active {
            background: rgba(255,255,255,0.3);
        }

        #waveform {
            height: 60px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }

        .bar {
            width: 4px;
            height: 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .error {
            background: rgba(255, 50, 50, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Thai Voice Translator</h1>

        <div class="card">
            <div class="label">Thai Input:</div>
            <div id="thaiText" class="output-box">Press the button and speak in Thai...</div>
        </div>

        <div class="card">
            <div class="label">English Translation:</div>
            <div id="translatedText" class="output-box">Translation will appear here...</div>
        </div>

        <button id="recordBtn" class="record-btn">🎤</button>

        <div id="status" class="status">Ready</div>

        <div id="waveform"></div>

        <div class="controls">
            <button id="clearBtn" class="btn">Clear</button>
            <button id="stopBtn" class="btn" style="display:none;">Stop</button>
        </div>

        <div id="error" style="display:none;" class="error"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
